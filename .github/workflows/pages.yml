# Build the Vite app and deploy dist/ to GitHub Pages.
# After this workflow is on main, set Settings → Pages → Source to "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

# contents: read for checkout. pages + id-token are required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Finish the in-progress production deploy; do not cancel it for a newer push.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # AI Studio syncs do not track package-lock.json and delete it on every
      # push. cache: npm and a bare `npm ci` both fail without a lockfile.
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
