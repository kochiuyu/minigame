<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOTE 3090 - Game Theory Mini-Games</title>
    
    <!-- Load Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load React -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Load Babel to compile JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const IconChevronDown = ({ size=24, className="" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m6 9 6 6 6-6"/></svg>
        );
        const IconInfo = ({ size=24, className="" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        );
        const IconListChecks = ({ size=24, className="" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></svg>
        );
        const IconCalculator = ({ size=24, className="" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></svg>
        );
        const IconLock = ({ size=24, className="" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        );
        const IconUnlock = ({ size=24, className="" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>
        );
        const IconTarget = ({ size=24, className="" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
        );
        const IconDollarSign = ({ size=24, className="" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" x2="12" y1="2" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        );

        const WEEKS = [
          {
            id: 1,
            title: "Week 1: Prisoner's Dilemma",
            purpose: "Understand why rational players often end up in a lose-lose outcome even when cooperation is better.",
            strategies: "You can choose to 'Cooperate' (work together) or 'Defect' (betray your partner).",
            payoffs: "Both Cooperate = 2 pts each. Both Defect = 1 pt each. If one Defects and one Cooperates, Defector gets 3 pts, Cooperator gets 0 pts.",
            instructions: [
              "Find a partner. Select Cooperate or Defect in Step 1 and LOCK it.",
              "On the count of three, reveal your choices simultaneously.",
              "Record your partner's choice in Step 2 and lock it to calculate your score.",
              "Find a NEW partner for the next round!"
            ],
            fields: [
              { id: 'myChoice', label: 'Your Choice', type: 'select', options: ['Cooperate', 'Defect'], step: 1 },
              { id: 'partnerChoice', label: "Partner's Choice", type: 'select', options: ['Cooperate', 'Defect'], step: 2 }
            ],
            calculate: (data) => {
              let score = 0;
              if (data.myChoice === 'Cooperate' && data.partnerChoice === 'Cooperate') score = 2;
              else if (data.myChoice === 'Cooperate' && data.partnerChoice === 'Defect') score = 0;
              else if (data.myChoice === 'Defect' && data.partnerChoice === 'Cooperate') score = 3;
              else if (data.myChoice === 'Defect' && data.partnerChoice === 'Defect') score = 1;
              return { "Your Score": `${score} points` };
            }
          },
          {
            id: 2,
            title: "Week 2: Launch-or-Wait",
            purpose: "Experience first-mover advantage and practice backward induction.",
            strategies: "First Mover chooses to 'Launch' or 'Wait'. Second Mover observes this, then chooses to 'Enter' or 'Stay Out'.",
            payoffs: "Launch + Stay Out: FM gets 4, SM gets 1. Launch + Enter: Both get 2. Wait + Enter: FM gets 1, SM gets 4. Wait + Stay Out: Both get 0.",
            instructions: [
              "Find a partner. Decide who is First Mover and Second Mover. Lock your role in Step 1.",
              "First Mover locks their choice in Step 1. (If you are Second Mover, wait).",
              "Second Mover sees the choice, decides, and you record it in Step 2."
            ],
            fields: [
              { id: 'myRole', label: 'Your Role', type: 'select', options: ['First Mover', 'Second Mover'], step: 1 },
              { id: 'fmChoice', label: 'First Mover Choice', type: 'select', options: ['Launch', 'Wait'], step: 1 },
              { id: 'smChoice', label: 'Second Mover Choice', type: 'select', options: ['Enter', 'Stay Out'], step: 2 }
            ],
            calculate: (data) => {
              let fmPoints = 0; let smPoints = 0; let outcome = "";
              if (data.fmChoice === 'Launch' && data.smChoice === 'Stay Out') { fmPoints = 4; smPoints = 1; outcome = "First Mover Wins Big!"; }
              else if (data.fmChoice === 'Launch' && data.smChoice === 'Enter') { fmPoints = 2; smPoints = 2; outcome = "Modest return for both."; }
              else if (data.fmChoice === 'Wait' && data.smChoice === 'Enter') { fmPoints = 1; smPoints = 4; outcome = "Second Mover Gains Advantage."; }
              else { fmPoints = 0; smPoints = 0; outcome = "Both missed out."; }
              const myScore = data.myRole === 'First Mover' ? fmPoints : smPoints;
              return { "Outcome": outcome, "Your Score": `${myScore} points` };
            }
          },
          {
            id: 3,
            title: "Week 3: Simultaneous Pricing",
            purpose: "Discover the concept of Nash Equilibrium by playing a simultaneous-move game.",
            strategies: "Secretly choose to set a 'High Price' or 'Low Price' for your product.",
            payoffs: "Both High = 2 pts each. Both Low = 1 pt each. If one is Low and one is High, Low gets 3 pts, High gets 0 pts.",
            instructions: [
              "Find a partner. Secretly decide your price in Step 1 and LOCK it.",
              "Reveal at the same time.",
              "Enter your partner's price in Step 2 to see the outcome."
            ],
            fields: [
              { id: 'myPrice', label: 'Your Price', type: 'select', options: ['High Price', 'Low Price'], step: 1 },
              { id: 'partnerPrice', label: "Partner's Price", type: 'select', options: ['High Price', 'Low Price'], step: 2 }
            ],
            calculate: (data) => {
              let score = 0;
              if (data.myPrice === 'High Price' && data.partnerPrice === 'High Price') score = 2;
              else if (data.myPrice === 'High Price' && data.partnerPrice === 'Low Price') score = 0;
              else if (data.myPrice === 'Low Price' && data.partnerPrice === 'High Price') score = 3;
              else if (data.myPrice === 'Low Price' && data.partnerPrice === 'Low Price') score = 1;
              return { "Your Score": `${score} points` };
            }
          },
          {
            id: 4,
            title: "Week 4: Random Promotion-Day",
            purpose: "Understand why being unpredictable can be a highly valuable strategy.",
            strategies: "Choose Monday, Wednesday, or Friday to launch your promotion.",
            payoffs: "If you pick the same day as your partner, you clash (0 pts). If you pick different days, success (1 pt).",
            instructions: [
              "Find a partner. Secretly choose a day in Step 1 and LOCK it.",
              "Reveal at the same time. If you clash, you both lose impact!",
              "Play two rounds in a row with the SAME partner to see if you can outguess them."
            ],
            fields: [
              { id: 'myDay', label: 'Your Day', type: 'select', options: ['Monday', 'Wednesday', 'Friday'], step: 1 },
              { id: 'partnerDay', label: "Partner's Day", type: 'select', options: ['Monday', 'Wednesday', 'Friday'], step: 2 }
            ],
            calculate: (data) => {
              if (data.myDay === data.partnerDay) return { "Outcome": "CLASH! Promotion failed.", "Your Score": "0 points" };
              return { "Outcome": "Different Days. Success!", "Your Score": "1 point" };
            }
          },
          {
            id: 5,
            title: "Week 5: The Commitment Game",
            purpose: "See why only irreversible actions are credible threats or promises.",
            strategies: "Player A (Incumbent) decides to 'Commit' or 'Stay Flexible'. Player B (Rival) observes and decides to 'Enter' or 'Stay Out'.",
            payoffs: "Commit + Stay Out = Monopoly for A. Commit + Enter = Price War (bad for both). Flexible + Enter = Duopoly (Rival enters successfully).",
            instructions: [
              "Find a partner. Decide roles. Record roles and Incumbent's choice in Step 1.",
              "Player B hears the decision, then chooses. Record Rival's choice in Step 2."
            ],
            fields: [
              { id: 'myRole', label: 'Your Role', type: 'select', options: ['Player A (Incumbent)', 'Player B (Rival)'], step: 1 },
              { id: 'pA_Choice', label: 'Incumbent Choice', type: 'select', options: ['Commit', 'Stay Flexible'], step: 1 },
              { id: 'pB_Choice', label: 'Rival Choice', type: 'select', options: ['Enter', 'Stay Out'], step: 2 }
            ],
            calculate: (data) => {
              let outcome = "";
              if (data.pA_Choice === 'Commit' && data.pB_Choice === 'Stay Out') outcome = "Incumbent keeps monopoly. Threat worked!";
              else if (data.pA_Choice === 'Commit' && data.pB_Choice === 'Enter') outcome = "Price War! Devastating for both.";
              else if (data.pA_Choice === 'Stay Flexible' && data.pB_Choice === 'Enter') outcome = "Rival enters successfully.";
              else outcome = "Rival stayed out unnecessarily. Incumbent wins.";
              return { "Market Outcome": outcome };
            }
          },
          {
            id: 6,
            title: "Week 6: Repeated Game & Triggers",
            purpose: "Experience how repetition and a 'trigger strategy' can sustain cooperation.",
            strategies: "Play Cooperate or Defect over multiple rounds with the SAME person.",
            payoffs: "Same payoffs as Week 1. BUT, if anyone defects once, the trigger forces BOTH to defect forever.",
            instructions: [
              "Stay with the SAME partner for ALL rounds.",
              "Secretly lock your choice in Step 1. Reveal, then record partner in Step 2.",
              "THE CATCH: If EITHER of you chooses 'Defect' even once, you must BOTH choose 'Defect' for all remaining rounds."
            ],
            fields: [
              { id: 'myChoice', label: 'Your Choice', type: 'select', options: ['Cooperate', 'Defect'], step: 1 },
              { id: 'partnerChoice', label: "Partner's Choice", type: 'select', options: ['Cooperate', 'Defect'], step: 2 }
            ],
            calculate: (data) => {
              let score = 0;
              if (data.myChoice === 'Cooperate' && data.partnerChoice === 'Cooperate') score = 2;
              else if (data.myChoice === 'Cooperate' && data.partnerChoice === 'Defect') score = 0;
              else if (data.myChoice === 'Defect' && data.partnerChoice === 'Cooperate') score = 3;
              else if (data.myChoice === 'Defect' && data.partnerChoice === 'Defect') score = 1;
              const trigger = (data.myChoice === 'Defect' || data.partnerChoice === 'Defect') 
                ? "⚠️ TRIGGER ACTIVATED!" : "Cooperation maintained.";
              return { "Your Score": `${score} points`, "Status": trigger };
            }
          },
          {
            id: 7,
            title: "Week 7: Second-Price Sealed-Bid Auction",
            purpose: "Understand the dominant strategy of bidding your true value in a second-price auction.",
            strategies: "Submit a sealed bid for an item. The highest bidder wins, but pays the SECOND-highest bid amount.",
            payoffs: "Assume you value the item at exactly 10 points. Profit = 10 - (Price Paid). Losers get 0.",
            partners: 3,
            instructions: [
              "Form groups of 3 to 4. Assume you all value the item at 10 points.",
              "Lock your own bid secretly in Step 1.",
              "Gather the group's bids and record them in Step 2.",
              "Lock Step 2 to see who won and what they pay!"
            ],
            fields: [
              { id: 'myBid', label: 'Your Bid', type: 'number', step: 1 },
              { id: 'bid2', label: "Partner 1's Bid", type: 'number', step: 2 },
              { id: 'bid3', label: "Partner 2's Bid", type: 'number', step: 2 },
              { id: 'bid4', label: "Partner 3's Bid (Optional)", type: 'number', step: 2 }
            ],
            calculate: (data) => {
              const bids = [data.myBid, data.bid2, data.bid3, data.bid4].map(b => parseFloat(b)).filter(b => !isNaN(b));
              const myBid = parseFloat(data.myBid);
              const highestBid = Math.max(...bids);
              
              // Sort bids descending to find second highest
              const sortedBids = [...bids].sort((a, b) => b - a);
              const secondHighest = sortedBids.length > 1 ? sortedBids[1] : 0;
              
              const highestBiddersCount = bids.filter(b => b === highestBid).length;
              
              if (myBid === highestBid) {
                if (highestBiddersCount > 1) {
                  return { "Status": "Tied for Win!", "Price Paid": highestBid, "Your Profit": `${10 - highestBid} points` };
                }
                return { "Status": "You Won!", "Price Paid": secondHighest, "Your Profit": `${10 - secondHighest} points` };
              } else {
                 return { "Status": "You Lost.", "Highest Bid": highestBid, "Your Profit": "0 points" };
              }
            }
          },
          {
            id: 8,
            title: "Week 8: Winner's Curse & Collusion",
            purpose: "Experience the risk of overpaying (winner's curse) and the temptation of cartels.",
            strategies: "Bid in a standard First-Price Sealed-Bid auction. In some rounds you must bid silently; in others, you can try to collude.",
            payoffs: "Highest bidder wins and pays their bid. Profit = (True Value revealed later) - (Winning Bid).",
            partners: 3,
            instructions: [
              "Play in groups of 3-4. Lock your own bid in Step 1.",
              "Record everyone else's bids in Step 2 to find the winner.",
              "Wait for the Instructor to reveal the True Value, then enter it at the bottom!"
            ],
            fields: [
              { id: 'rule', label: 'Rule', type: 'select', options: ['Independent (Silent)', 'Collusion Allowed'], step: 1 },
              { id: 'myBid', label: 'Your Bid', type: 'number', step: 1 },
              { id: 'bid2', label: "Partner 1's Bid", type: 'number', step: 2 },
              { id: 'bid3', label: "Partner 2's Bid", type: 'number', step: 2 },
              { id: 'bid4', label: "Partner 3's Bid (Optional)", type: 'number', step: 2 },
              { id: 'trueValue', label: 'True Value (Revealed by Instructor)', type: 'number', postReveal: true }
            ],
            calculate: (data) => {
              const bids = [data.myBid, data.bid2, data.bid3, data.bid4].map(b => parseFloat(b)).filter(b => !isNaN(b));
              const highestBid = Math.max(...bids);
              const isWinner = parseFloat(data.myBid) === highestBid;
              
              let result = { "Did you win?": isWinner ? "Yes" : "No", "Highest Bid": highestBid };
              if (data.trueValue && !isNaN(parseFloat(data.trueValue))) {
                const tv = parseFloat(data.trueValue);
                if (isWinner) {
                  const profit = tv - highestBid;
                  result["Your Profit/Loss"] = profit >= 0 ? `+${profit}` : `${profit} (Winner's Curse!)`;
                } else {
                  result["Your Profit/Loss"] = "0 (Didn't buy)";
                }
              } else {
                 result["Your Profit/Loss"] = "Awaiting True Value...";
              }
              return result;
            }
          },
          {
            id: 9,
            title: "Week 9: Split-the-Pie Negotiation",
            purpose: "Feel how time limits and 'outside options' affect bargaining power.",
            strategies: "You and a partner have 60 seconds to demand a portion of 10 points.",
            payoffs: "If Demands sum to <= 10, you get your demand. If Demands sum > 10, deal fails and you get your Outside Option (1 pt).",
            instructions: [
              "Find a partner. You have 60 seconds to negotiate how to split 10 points.",
              "Lock your demanded share in Step 1.",
              "Record your partner's demanded share in Step 2."
            ],
            fields: [
              { id: 'myDemand', label: 'Your Demand (Out of 10)', type: 'number', step: 1 },
              { id: 'partnerDemand', label: "Partner's Demand", type: 'number', step: 2 }
            ],
            calculate: (data) => {
              const total = parseFloat(data.myDemand) + parseFloat(data.partnerDemand);
              if (total <= 10) {
                return { "Status": "Deal Reached!", "Your Score": `${data.myDemand} points` };
              } else {
                return { "Status": `Deal Failed (Total = ${total})`, "Your Score": "1 point (Outside Option)" };
              }
            }
          },
          {
            id: 10,
            title: "Week 10: Costly Signaling",
            purpose: "See why only costly signals can separate high quality from low quality.",
            strategies: "Seller decides to 'Buy Costly Signal' or 'No Signal'. Buyer decides to 'Trust' or 'Don't Trust'.",
            payoffs: "Signal costs the seller money. Buyers make profit trusting High Quality, but lose money trusting Low Quality.",
            instructions: [
              "Find a partner. Decide roles. Lock roles and Seller's signal choice in Step 1.",
              "Buyer observes the signal, then decides to trust or not. Record in Step 2."
            ],
            fields: [
              { id: 'myRole', label: 'Your Role', type: 'select', options: ['Seller (High Quality)', 'Seller (Low Quality)', 'Buyer'], step: 1 },
              { id: 'signal', label: 'Did Seller Signal?', type: 'select', options: ['Yes (Costly)', 'No'], step: 1 },
              { id: 'trust', label: 'Did Buyer Trust?', type: 'select', options: ['Yes', 'No'], step: 2 }
            ],
            calculate: (data) => {
              let outcome = "";
              if (data.signal === 'Yes (Costly)' && data.trust === 'Yes') outcome = "Signal worked! Buyer trusted.";
              else if (data.signal === 'No' && data.trust === 'Yes') outcome = "Buyer trusted blindly (risky!).";
              else if (data.signal === 'Yes (Costly)' && data.trust === 'No') outcome = "Signal failed. Money wasted.";
              else outcome = "No signal, no trust. Stagnant market.";
              return { "Market Outcome": outcome };
            }
          }
        ];

        function App() {
          const [studentInfo, setStudentInfo] = useState({ name: '', id: '', alias: '' });
          const [activeWeek, setActiveWeek] = useState(1);
          const [roundsData, setRoundsData] = useState({});
          const [reflections, setReflections] = useState({});
          const [copyStatus, setCopyStatus] = useState('');

          // Load data from local storage on mount
          useEffect(() => {
            try {
              const savedInfo = localStorage.getItem('gameTheoryStudentInfo');
              const savedRounds = localStorage.getItem('gameTheoryRounds');
              const savedReflections = localStorage.getItem('gameTheoryReflections');
              if (savedInfo) setStudentInfo(JSON.parse(savedInfo));
              if (savedRounds) setRoundsData(JSON.parse(savedRounds));
              if (savedReflections) setReflections(JSON.parse(savedReflections));
            } catch (e) {
              console.error("Could not load local storage", e);
            }
          }, []);

          // Save data to local storage on change
          useEffect(() => {
            localStorage.setItem('gameTheoryStudentInfo', JSON.stringify(studentInfo));
            localStorage.setItem('gameTheoryRounds', JSON.stringify(roundsData));
            localStorage.setItem('gameTheoryReflections', JSON.stringify(reflections));
          }, [studentInfo, roundsData, reflections]);

          const handleInfoChange = (field, value) => setStudentInfo(prev => ({ ...prev, [field]: value }));

          const handleFieldChange = (weekId, roundNum, fieldId, value) => {
            setRoundsData(prev => {
              const weekData = prev[weekId] || {};
              const roundData = weekData[roundNum] || {};
              return { ...prev, [weekId]: { ...weekData, [roundNum]: { ...roundData, [fieldId]: value } } };
            });
          };

          const handleReflectionChange = (weekId, text) => setReflections(prev => ({ ...prev, [weekId]: text }));

          const handleLockStep1 = (weekId, roundNum) => {
            const timeStr = new Date().toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
            setRoundsData(prev => {
              const weekData = prev[weekId] || {};
              const roundData = weekData[roundNum] || {};
              return { ...prev, [weekId]: { ...weekData, [roundNum]: { ...roundData, isStep1Locked: true, step1Time: timeStr } } };
            });
          };

          const handleLockStep2 = (weekId, roundNum) => {
            const timeStr = new Date().toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
            setRoundsData(prev => {
              const weekData = prev[weekId] || {};
              const roundData = weekData[roundNum] || {};
              return { ...prev, [weekId]: { ...weekData, [roundNum]: { ...roundData, isStep2Locked: true, step2Time: timeStr } } };
            });
          };

          const generateSubmissionText = () => {
            const weekConfig = WEEKS.find(w => w.id === activeWeek);
            const wData = roundsData[activeWeek] || {};
            const refText = reflections[activeWeek] || "No reflection provided.";
            
            let text = `DOTE 3090 - Game Theory Submission\n`;
            text += `Student: ${studentInfo.name || "Unknown"} (${studentInfo.id || "No ID"})\n`;
            text += `Alias: ${studentInfo.alias || "None"}\n`;
            text += `Topic: ${weekConfig.title}\n\n`;
            text += `--- ROUND DATA ---\n`;
            
            for (let r = 1; r <= 6; r++) {
              const rData = wData[r] || {};
              if (!rData.isStep1Locked && !rData.isStep2Locked) continue;
              
              text += `Round ${r}${rData.isStep2Locked ? ' [COMPLETED]' : ' [INCOMPLETE]'}:\n`;
              if (rData.step1Time) text += `  [Locked Step 1 at ${rData.step1Time}]\n`;
              if (rData.step2Time) text += `  [Locked Step 2 at ${rData.step2Time}]\n`;

              const numPartners = weekConfig.partners || 1;
              for (let p = 1; p <= numPartners; p++) {
                const alias = rData[`partnerAlias${p}`];
                if (alias) text += `  Group Member ${p} Alias: ${alias}\n`;
              }
              
              weekConfig.fields.forEach(field => {
                text += `  ${field.label}: ${rData[field.id] || "-"}\n`;
              });
              
              if (rData.isStep2Locked) {
                const calculated = weekConfig.calculate(rData);
                if (calculated) {
                  text += `  > Results:\n`;
                  Object.entries(calculated).forEach(([key, val]) => { text += `    ${key}: ${val}\n`; });
                }
              }
            }
            
            text += `\n--- REFLECTION ---\n${refText}\n`;
            return text;
          };

          const handleCopySubmission = async () => {
            const text = generateSubmissionText();
            try {
              await navigator.clipboard.writeText(text);
              setCopyStatus('Copied! Paste this directly into Canvas/Blackboard.');
              setTimeout(() => setCopyStatus(''), 4000);
            } catch (err) {
              setCopyStatus('Failed to copy. Please manually select and copy the summary.');
            }
          };

          const currentWeekConfig = WEEKS.find(w => w.id === activeWeek);
          
          // Check if all header identification fields are filled
          const isReadyToSubmit = studentInfo.name.trim() !== '' && studentInfo.id.trim() !== '' && studentInfo.alias.trim() !== '';

          return (
            <div className="min-h-screen text-slate-800 font-sans pb-24 selection:bg-blue-200">
              
              {/* Header */}
              <header className="bg-slate-900 text-white p-4 shadow-lg sticky top-0 z-20">
                <h1 className="text-xl font-bold mb-3 tracking-tight flex justify-between items-center">
                  <span>DOTE 3090 Mini-Games</span>
                </h1>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                  <input type="text" placeholder="Your Name *" 
                    className={`px-3 py-2 rounded text-black focus:outline-none focus:ring-2 font-medium transition-colors ${!studentInfo.name ? 'bg-red-100 placeholder-red-400 focus:ring-red-500' : 'bg-slate-100 focus:bg-white focus:ring-blue-500'}`}
                    value={studentInfo.name} onChange={(e) => handleInfoChange('name', e.target.value)} />
                  <input type="text" placeholder="Student ID *" 
                    className={`px-3 py-2 rounded text-black focus:outline-none focus:ring-2 font-medium transition-colors ${!studentInfo.id ? 'bg-red-100 placeholder-red-400 focus:ring-red-500' : 'bg-slate-100 focus:bg-white focus:ring-blue-500'}`}
                    value={studentInfo.id} onChange={(e) => handleInfoChange('id', e.target.value)} />
                  <input type="text" placeholder="Your Fun Alias *" 
                    className={`px-3 py-2 rounded text-black focus:outline-none focus:ring-2 font-medium transition-colors border ${!studentInfo.alias ? 'bg-red-100 border-red-200 placeholder-red-400 focus:ring-red-500' : 'bg-amber-50 border-amber-300 focus:bg-white focus:ring-amber-500'}`}
                    value={studentInfo.alias} onChange={(e) => handleInfoChange('alias', e.target.value)} />
                </div>
              </header>

              <main className="max-w-4xl mx-auto p-4 mt-2">
                {/* Week Selector */}
                <div className="mb-6 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                  <label className="block text-sm font-bold mb-2 text-slate-500 uppercase tracking-wide">Select Topic</label>
                  <div className="relative">
                    <select 
                      className="block appearance-none w-full bg-slate-50 border border-slate-300 text-slate-900 py-3 px-4 pr-8 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-600 font-bold text-lg cursor-pointer"
                      value={activeWeek} onChange={(e) => setActiveWeek(parseInt(e.target.value))}
                    >
                      {WEEKS.map(w => (<option key={w.id} value={w.id}>{w.title}</option>))}
                    </select>
                    <div className="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-500">
                        <IconChevronDown size={20} />
                    </div>
                  </div>
                </div>

                {/* Instructions Card with Strategies and Payoffs */}
                <div className="mb-8 bg-blue-50 p-5 rounded-xl border border-blue-200 shadow-sm space-y-4">
                  <div className="flex items-start gap-3">
                    <div className="text-blue-600 mt-1 shrink-0"><IconInfo size={24} /></div>
                    <div>
                      <h2 className="text-lg font-bold text-blue-900">Purpose</h2>
                      <p className="text-blue-800 leading-snug">{currentWeekConfig.purpose}</p>
                    </div>
                  </div>
                  
                  <div className="flex items-start gap-3">
                    <div className="text-blue-600 mt-1 shrink-0"><IconTarget size={24} /></div>
                    <div>
                      <h2 className="text-lg font-bold text-blue-900">Strategies</h2>
                      <p className="text-blue-800 leading-snug">{currentWeekConfig.strategies}</p>
                    </div>
                  </div>

                  <div className="flex items-start gap-3">
                    <div className="text-blue-600 mt-1 shrink-0"><IconDollarSign size={24} /></div>
                    <div>
                      <h2 className="text-lg font-bold text-blue-900">Payoffs</h2>
                      <p className="text-blue-800 leading-snug">{currentWeekConfig.payoffs}</p>
                    </div>
                  </div>

                  <div className="flex items-start gap-3">
                    <div className="text-blue-600 mt-1 shrink-0"><IconListChecks size={24} /></div>
                    <div className="w-full">
                      <h2 className="text-lg font-bold text-blue-900 mb-1">How to Play</h2>
                      <ol className="list-decimal ml-5 space-y-1 text-blue-900/90 font-medium">
                        {currentWeekConfig.instructions.map((step, idx) => (<li key={idx} className="pl-1">{step}</li>))}
                      </ol>
                    </div>
                  </div>
                </div>

                {/* Game Rounds */}
                <div className="space-y-6 mb-8">
                  <h2 className="text-xl font-bold border-b-2 border-slate-300 pb-2 text-slate-800">Game Rounds</h2>
                  
                  {[1, 2, 3, 4, 5, 6].map(roundNum => {
                    const rData = (roundsData[activeWeek] && roundsData[activeWeek][roundNum]) || {};
                    const isStep1Locked = rData.isStep1Locked === true;
                    const isStep2Locked = rData.isStep2Locked === true;
                    const numPartners = currentWeekConfig.partners || 1;
                    
                    const step1Fields = currentWeekConfig.fields.filter(f => f.step === 1);
                    const step2Fields = currentWeekConfig.fields.filter(f => f.step === 2);
                    const postRevealFields = currentWeekConfig.fields.filter(f => f.postReveal);
                    
                    // Safety check: Ensure all required fields for each step are filled before allowing lock
                    const areAliasesReady = Array.from({ length: numPartners }).every((_, idx) => {
                      const aliasVal = rData[`partnerAlias${idx + 1}`];
                      return aliasVal !== undefined && aliasVal.trim() !== '';
                    });
                    const isStep1Ready = step1Fields.every(f => rData[f.id] !== undefined && rData[f.id] !== '') && areAliasesReady;
                    const isStep2Ready = step2Fields.every(f => f.label.includes('Optional') || (rData[f.id] !== undefined && rData[f.id] !== ''));
                    
                    let headerStyle = "bg-slate-200 text-slate-700 border-slate-300";
                    let statusText = "🔓 Not Started";
                    if (isStep2Locked) { headerStyle = "bg-emerald-100 text-emerald-800 border-emerald-300"; statusText = "✅ Round Complete"; }
                    else if (isStep1Locked) { headerStyle = "bg-amber-100 text-amber-800 border-amber-300"; statusText = "🔓 Awaiting Partner Data..."; }

                    return (
                      <div key={roundNum} className={`bg-white rounded-xl shadow-sm border ${isStep2Locked ? 'border-emerald-300 ring-1 ring-emerald-200' : 'border-slate-300'} overflow-hidden`}>
                        
                        {/* Round Header */}
                        <div className={`${headerStyle} px-5 py-3 border-b flex justify-between items-center transition-colors`}>
                          <span className="font-black text-lg">Round {roundNum}</span>
                          <span className="text-xs font-bold px-2 py-1 bg-white/50 rounded uppercase tracking-wider">{statusText}</span>
                        </div>

                        {/* STEP 1 SECTION: My Choices */}
                        <div className={`p-5 ${isStep1Locked ? 'bg-slate-50 grayscale-[20%]' : 'bg-blue-50/30'}`}>
                          <div className="flex items-center justify-between mb-4">
                            <h3 className="text-sm font-black text-blue-800 uppercase tracking-widest flex items-center gap-2 m-0">
                              {isStep1Locked ? <IconLock size={16}/> : <IconUnlock size={16}/>} Step 1: Your Decisions
                            </h3>
                            {rData.step1Time && <span className="text-xs font-bold text-blue-700 bg-blue-100/80 px-2 py-1 rounded">Locked at {rData.step1Time}</span>}
                          </div>
                          
                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                            {/* Aliases are part of Step 1 */}
                            {Array.from({ length: numPartners }).map((_, idx) => (
                              <div key={`alias-${idx}`} className="p-1">
                                <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">
                                  {numPartners > 1 ? `Group Member ${idx + 1} Alias` : "Partner's Alias"}
                                </label>
                                <input type="text" placeholder="Who are you playing?"
                                  className="w-full border-b-2 border-slate-300 py-2 focus:outline-none focus:border-blue-600 bg-transparent px-2 font-bold text-slate-800 disabled:opacity-60 disabled:cursor-not-allowed"
                                  value={rData[`partnerAlias${idx + 1}`] || ''}
                                  disabled={isStep1Locked}
                                  onChange={(e) => handleFieldChange(activeWeek, roundNum, `partnerAlias${idx + 1}`, e.target.value)} />
                              </div>
                            ))}
                            
                            {/* Step 1 Fields */}
                            {step1Fields.map(field => (
                              <div key={field.id} className="p-1">
                                <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">{field.label}</label>
                                {field.type === 'select' ? (
                                  <div className="relative">
                                    <select className="block appearance-none w-full bg-slate-100/50 border-b-2 border-slate-300 text-slate-800 py-2 px-2 pr-8 focus:outline-none focus:border-blue-600 font-bold cursor-pointer disabled:opacity-60 disabled:cursor-not-allowed"
                                       value={rData[field.id] || ''} disabled={isStep1Locked}
                                       onChange={(e) => handleFieldChange(activeWeek, roundNum, field.id, e.target.value)}>
                                        <option value="" disabled>Select...</option>
                                        {field.options.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                                    </select>
                                    <div className="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-400">
                                        <IconChevronDown size={16} />
                                    </div>
                                  </div>
                                ) : (
                                  <input type="number" placeholder="Enter amount..."
                                    className="w-full border-b-2 border-slate-300 py-2 focus:outline-none focus:border-blue-600 bg-transparent px-2 font-bold text-slate-800 disabled:opacity-60 disabled:cursor-not-allowed"
                                    value={rData[field.id] || ''} disabled={isStep1Locked}
                                    onChange={(e) => handleFieldChange(activeWeek, roundNum, field.id, e.target.value)} />
                                )}
                              </div>
                            ))}
                          </div>
                          
                          {!isStep1Locked && (
                            <div className="flex justify-end mt-2">
                              <button onClick={() => handleLockStep1(activeWeek, roundNum)}
                                disabled={!isStep1Ready}
                                className={`font-bold py-2.5 px-6 rounded-lg shadow transition-colors flex items-center gap-2 text-sm active:scale-95 ${isStep1Ready ? 'bg-blue-600 hover:bg-blue-700 text-white' : 'bg-slate-300 text-slate-500 cursor-not-allowed'}`}>
                                🔒 Lock My Choices
                              </button>
                            </div>
                          )}
                        </div>

                        {/* STEP 2 SECTION: Partner's Choices */}
                        <div className={`p-5 border-t border-slate-200 transition-all ${!isStep1Locked ? 'opacity-40 pointer-events-none bg-slate-100' : isStep2Locked ? 'bg-slate-50 grayscale-[20%]' : 'bg-amber-50/40'}`}>
                          <div className="flex items-center justify-between mb-4">
                            <h3 className={`text-sm font-black uppercase tracking-widest flex items-center gap-2 m-0 ${!isStep1Locked ? 'text-slate-500' : 'text-amber-700'}`}>
                              {isStep2Locked ? <IconLock size={16}/> : <IconUnlock size={16}/>} Step 2: Partner's Decisions
                            </h3>
                            {rData.step2Time && <span className="text-xs font-bold text-amber-700 bg-amber-100/80 px-2 py-1 rounded">Locked at {rData.step2Time}</span>}
                          </div>
                          
                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                            {step2Fields.map(field => (
                              <div key={field.id} className="p-1">
                                <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">{field.label}</label>
                                {field.type === 'select' ? (
                                  <div className="relative">
                                    <select className="block appearance-none w-full bg-slate-100/50 border-b-2 border-slate-300 text-slate-800 py-2 px-2 pr-8 focus:outline-none focus:border-amber-600 font-bold cursor-pointer disabled:opacity-60 disabled:cursor-not-allowed"
                                       value={rData[field.id] || ''} disabled={!isStep1Locked || isStep2Locked}
                                       onChange={(e) => handleFieldChange(activeWeek, roundNum, field.id, e.target.value)}>
                                        <option value="" disabled>Select...</option>
                                        {field.options.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                                    </select>
                                    <div className="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-400">
                                        <IconChevronDown size={16} />
                                    </div>
                                  </div>
                                ) : (
                                  <input type="number" placeholder="Enter amount..."
                                    className="w-full border-b-2 border-slate-300 py-2 focus:outline-none focus:border-amber-600 bg-transparent px-2 font-bold text-slate-800 disabled:opacity-60 disabled:cursor-not-allowed"
                                    value={rData[field.id] || ''} disabled={!isStep1Locked || isStep2Locked}
                                    onChange={(e) => handleFieldChange(activeWeek, roundNum, field.id, e.target.value)} />
                                )}
                              </div>
                            ))}
                          </div>

                          {isStep1Locked && !isStep2Locked && (
                            <div className="flex justify-end mt-2">
                              <button onClick={() => handleLockStep2(activeWeek, roundNum)}
                                disabled={!isStep2Ready}
                                className={`font-bold py-2.5 px-6 rounded-lg shadow transition-colors flex items-center gap-2 text-sm active:scale-95 ${isStep2Ready ? 'bg-amber-600 hover:bg-amber-700 text-white' : 'bg-slate-300 text-slate-500 cursor-not-allowed'}`}>
                                🔒 Record & Reveal Score
                              </button>
                            </div>
                          )}
                        </div>

                        {/* Auto-Calculated Results Box */}
                        {isStep2Locked && currentWeekConfig.calculate(rData) && (
                          <div className="bg-emerald-50 p-5 border-t border-emerald-200 flex flex-col sm:flex-row gap-4 items-start sm:items-center justify-between">
                            <div className="flex items-center gap-2 text-emerald-700 font-bold mb-2 sm:mb-0">
                              <IconCalculator size={22} /><span>Round Results:</span>
                            </div>
                            <div className="flex flex-wrap gap-3">
                              {Object.entries(currentWeekConfig.calculate(rData)).map(([key, val]) => (
                                <div key={key} className="bg-white px-3 py-2 rounded-lg shadow-sm border border-emerald-200">
                                  <span className="text-[10px] uppercase text-emerald-600 font-black block mb-0.5 tracking-wider">{key}</span>
                                  <span className="font-black text-slate-800">{val}</span>
                                </div>
                              ))}
                            </div>
                          </div>
                        )}
                        
                        {/* Post Reveal Fields (e.g., True Value in Week 8) */}
                        {postRevealFields.length > 0 && isStep2Locked && (
                           <div className="p-5 bg-purple-50/50 border-t border-purple-100">
                              <h4 className="text-xs font-black text-purple-800 uppercase tracking-widest mb-3">Post-Round Reveal</h4>
                              <div className="grid grid-cols-1 gap-4">
                                {postRevealFields.map(field => (
                                   <div key={field.id} className="p-1">
                                     <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">{field.label}</label>
                                     <input type="number" placeholder="Wait for instructor..."
                                        className="w-full sm:w-1/2 border-b-2 border-purple-300 py-2 focus:outline-none focus:border-purple-600 bg-transparent px-2 font-bold text-slate-800"
                                        value={rData[field.id] || ''}
                                        onChange={(e) => handleFieldChange(activeWeek, roundNum, field.id, e.target.value)} />
                                   </div>
                                ))}
                              </div>
                           </div>
                        )}
                        
                      </div>
                    );
                  })}
                </div>

                {/* Reflection */}
                <div className="mb-8 bg-white p-6 rounded-xl shadow-sm border border-slate-300">
                  <h2 className="text-xl font-bold mb-2 text-slate-800">Weekly Reflection</h2>
                  <p className="text-slate-600 mb-4 font-medium leading-relaxed">
                    Based on today's games, what did you learn about strategy? How does this concept apply to real business scenarios?
                  </p>
                  <textarea 
                    className="w-full bg-slate-50 border-2 border-slate-300 rounded-xl p-4 h-32 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 resize-y text-slate-800 font-medium"
                    placeholder="Type your reflection here..."
                    value={reflections[activeWeek] || ''}
                    onChange={(e) => handleReflectionChange(activeWeek, e.target.value)}
                  ></textarea>
                </div>

                {/* Submit Action */}
                <div className="bg-slate-900 p-8 rounded-xl shadow-xl text-center text-white">
                  <h3 className="font-black text-2xl mb-3">Ready to Submit?</h3>
                  <p className="text-slate-300 mb-6 font-medium max-w-lg mx-auto leading-relaxed">
                    Click the button below to copy your answers, then paste them directly into your Canvas/Blackboard submission box!
                  </p>
                  
                  {!isReadyToSubmit && (
                    <div className="mb-6 p-4 bg-red-900/40 border border-red-500 rounded-lg max-w-lg mx-auto">
                      <p className="text-red-200 font-bold flex items-center justify-center gap-2">
                        ⚠️ Please fill in your Name, Student ID, and Alias at the top of the page first!
                      </p>
                    </div>
                  )}

                  <button onClick={handleCopySubmission}
                    disabled={!isReadyToSubmit}
                    className={`font-black py-4 px-8 rounded-xl w-full sm:w-auto shadow-lg transition-all transform active:scale-95 text-lg flex items-center justify-center gap-3 mx-auto ${isReadyToSubmit ? 'bg-blue-600 hover:bg-blue-500 text-white' : 'bg-slate-700 text-slate-500 cursor-not-allowed'}`}>
                    📋 COPY SUBMISSION
                  </button>
                  
                  {copyStatus && (
                    <div className={`mt-5 font-bold p-3 rounded-lg max-w-sm mx-auto ${copyStatus.includes('Failed') ? 'bg-red-900/50 text-red-200 border border-red-500' : 'bg-emerald-900/50 text-emerald-200 border border-emerald-500'}`}>
                      {copyStatus}
                    </div>
                  )}
                </div>
              </main>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
